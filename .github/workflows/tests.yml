name: Feature tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # the runner image ships with Google Chrome, so no browser download is needed
      - name: Run all feature tests
        run: npm test
        env:
          BROWSER_CHANNEL: chrome
